<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지역별 여행지 카드북</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; color: #333; padding: 24px; }
    .container { max-width: 960px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 1.8rem; margin-bottom: 8px; }
    header p { color: #666; font-size: 0.95rem; }

    /* 제어 패널 */
    .control-panel { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 32px; }
    select { padding: 10px 16px; font-size: 1rem; border: 1px solid #ddd; border-radius: 6px; background-color: #fff; outline: none; }
    .status-text { text-align: center; font-size: 0.9rem; color: #555; margin-bottom: 16px; }

    /* 카드 그리드 뷰 */
    #card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.06); display: flex; flex-direction: column; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card-img { width: 100%; height: 180px; object-fit: cover; background-color: #eee; }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
    .card-addr { font-size: 0.85rem; color: #777; margin-top: auto; }

    /* 초기/공백 상태 */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>지역별 여행지 카드북</h1>
      <p>원하는 지역을 선택하면 관광지와 이미지를 확인하고 기록합니다.</p>
    </header>

    <div class="control-panel">
      <label for="areaSelect"><strong>지역 선택:</strong></label>
      <select id="areaSelect">
        <option value="">-- 지역을 선택하세요 --</option>
        <option value="1">서울</option>
        <option value="6">부산</option>
        <option value="4">대구</option>
        <option value="2">인천</option>
        <option value="5">광주</option>
        <option value="3">대전</option>
        <option value="31">경기도</option>
        <option value="32">강원도</option>
        <option value="39">제주도</option>
      </select>
    </div>

    <div id="statusMessage" class="status-text"></div>
    
    <!-- 초기 상태에는 목록이 숨겨짐 -->
    <div id="card-container" class="hidden"></div>
  </div>

  <script>
    // --- 1. 환경 설정 상수 (본인 정보로 수정) ---
    // 공공데이터포털 디코딩된 인증키(Encoding 키를 쓸 경우 URL 인코딩 중복 주의)
    const TOUR_API_KEY = 'YOUR_PUBLIC_DATA_API_KEY'; 
    // Firebase Realtime Database URL
    const FIREBASE_DB_URL = 'https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com/userActivity/lastSelectedArea.json';

    const areaSelect = document.getElementById('areaSelect');
    const cardContainer = document.getElementById('card-container');
    const statusMessage = document.getElementById('statusMessage');

    // --- 2. 초기 로딩 시 Firebase 상태 점검 ---
    window.addEventListener('DOMContentLoaded', async () => {
      statusMessage.textContent = '저장된 이전 기록을 불러오는 중...';
      try {
        const response = await fetch(FIREBASE_DB_URL);
        const data = await response.json();

        if (data && data.areaCode) {
          // 저장된 지역 정보가 존재하는 경우
          areaSelect.value = data.areaCode;
          statusMessage.textContent = `이전에 선택한 '${data.areaName}'의 관광지 목록입니다.`;
          await fetchTourData(data.areaCode);
        } else {
          // 저장된 지역 정보가 없는 경우: 뷰를 완전히 숨김
          cardContainer.classList.add('hidden');
          statusMessage.textContent = '선택된 지역이 없습니다. 상단에서 지역을 골라주세요.';
        }
      } catch (err) {
        console.error('Firebase 로딩 실패:', err);
        cardContainer.classList.add('hidden');
        statusMessage.textContent = '데이터를 불러오는 중 오류가 발생했습니다.';
      }
    });

    // --- 3. 지역 선택 이벤트 감지 ---
    areaSelect.addEventListener('change', async (e) => {
      const areaCode = e.target.value;
      const areaName = e.target.options[e.target.selectedIndex].text;

      if (!areaCode) {
        cardContainer.classList.add('hidden');
        statusMessage.textContent = '지역을 선택해주세요.';
        return;
      }

      statusMessage.textContent = `'${areaName}' 정보를 가져오고 저장하는 중...`;
      
      // TourAPI 호출 및 카드 목록 표출
      await fetchTourData(areaCode);
      
      // Firebase에 선택된 지역 덮어쓰기 업데이트
      await saveAreaToFirebase(areaCode, areaName);
      statusMessage.textContent = `'${areaName}' 조회 및 저장이 완료되었습니다.`;
    });

    // --- 4. 한국관광공사 국문 관광정보 서비스(지역기반 관광정보조회) 호출 ---
    async function fetchTourData(areaCode) {
      const endpoint = 'https://apis.data.go.kr/B551011/KorService1/areaBasedList1';
      const params = new URLSearchParams({
        serviceKey: TOUR_API_KEY,
        numOfRows: '12',
        pageNo: '1',
        MobileOS: 'ETC',
        MobileApp: 'AreaCardBook',
        _type: 'json',
        areaCode: areaCode,
        arrange: 'Q' // 대표이미지가 있는 항목 우선 정렬
      });

      try {
        const res = await fetch(`${endpoint}?${params.toString()}`);
        const result = await res.json();
        
        const items = result.response?.body?.items?.item || [];
        renderCardView(items);
      } catch (error) {
        console.error('TourAPI 호출 에러:', error);
        statusMessage.textContent = '관광 정보를 가져오지 못했습니다.';
      }
    }

    // --- 5. 카드 뷰 동적 렌더링 ---
    function renderCardView(items) {
      cardContainer.innerHTML = '';

      if (items.length === 0) {
        statusMessage.textContent = '조회된 관광 정보가 없습니다.';
        cardContainer.classList.add('hidden');
        return;
      }

      items.forEach(item => {
        // 이미지가 없을 경우 대체 이미지 지정
        const imageUrl = item.firstimage || 'https://via.placeholder.com/300x180?text=No+Image';
        const title = item.title || '명칭 미정';
        const addr = item.addr1 || '상세 주소 없음';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="card-img" src="${imageUrl}" alt="${title}" loading="lazy">
          <div class="card-body">
            <h3 class="card-title">${title}</h3>
            <p class="card-addr">${addr}</p>
          </div>
        `;
        cardContainer.appendChild(card);
      });

      // 목록 뷰 보이기
      cardContainer.classList.remove('hidden');
    }

    // --- 6. Firebase Realtime Database 업데이트 (PUT) ---
    async function saveAreaToFirebase(areaCode, areaName) {
      try {
        await fetch(FIREBASE_DB_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            areaCode: areaCode,
            areaName: areaName,
            updatedAt: new Date().toISOString()
          })
        });
      } catch (err) {
        console.error('Firebase 저장 실패:', err);
      }
    }
  </script>
</body>
</html>
